allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir('../../build').get()
rootProject.layout.buildDirectory.set(newBuildDir)
subprojects {
    project.layout.buildDirectory.set(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    def configureAndroidProject = { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (it.hasProperty('compileOptions')) {
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
                if (it.hasProperty('kotlinOptions')) {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                }
                if (project.name != 'app' && it.hasProperty('namespace') && it.namespace == null) {
                    it.namespace = project.group
                }
            }
        }
    }

    if (project.state.executed) {
        configureAndroidProject(project)
    } else {
        project.afterEvaluate {
            configureAndroidProject(project)
        }
    }
}


// SiteSnap Phase 3-7: keep camera_android_camerax pinned at 0.7.1+2 / CameraX
// 1.5.3. Replace only the provider-binding and VideoCapture-builder seams so
// OverlayEffect and capture-time front mirroring can be configured without
// mutating Flutter's pub cache or upgrading the CameraX stack.
subprojects { cameraProject ->
    if (cameraProject.name == 'camera_android_camerax') {
        cameraProject.pluginManager.withPlugin('com.android.library') {
            cameraProject.android.sourceSets.main.java {
                exclude 'io/flutter/plugins/camerax/ProcessCameraProviderProxyApi.java'
                exclude 'io/flutter/plugins/camerax/VideoCaptureProxyApi.java'
                srcDir rootProject.file('camerax_patch')
            }
            cameraProject.dependencies.add(
                'implementation',
                'androidx.camera:camera-effects:1.5.3'
            )
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
